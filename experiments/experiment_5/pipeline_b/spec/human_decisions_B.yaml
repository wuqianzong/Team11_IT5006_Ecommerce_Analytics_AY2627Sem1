# Human decisions for Pipeline B (G-79). Filled by the team, never by code.
# Changes are logged in pipeline_b/CHANGELOG_B.md.
# B8 stops at its gate until the b08 section for its task is complete (as G-39 for A).

b05:
  fold_minimum_deviation: {accepted: true, observed: "B5 accepted run 20261023T160529Z / 20261023T160533Z (tag e5-B-s05-accepted): fold 1 training rows regression 7,932, classification 7,592 (874 training detractors); safeguard met; source pipeline_b/stages/b05/<task>/outputs/minimums_B.csv", rationale: "keep A's five folds so the A-B comparison stays on identical periods and G-79's 5-fold mean is unchanged; fold 1 still has ample rows for the agreed models; safeguard: B5 stops below 5,000 training rows or (classification) 300 training detractors; folds 2-5 shown as description in B8 (B-G-01)", decided_by: "experiment lead (Wu Qianzong)", date: 2026-10-23}

b08:
  regression:
    model: {chosen: reg.sel.log.linear, recommended: reg.sel.log.linear, rationale: "one-SE recommendation over the finalists, same rule as A (s01 1.7, G-33); the forest has the best mean but is within one SE of the plain linear model", grid_edge_action: none, decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-24}
  classification:
    model: {chosen: clf.sel.log.logistic, recommended: clf.sel.log.logistic, rationale: "one-SE recommendation over the finalists, same rule as A (s01 1.7, G-33); the forest has the best mean but is within one SE of the plain logistic model; calibration sigmoid by B-G-05", grid_edge_action: none, decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-24}
    calibration_override: {value: sigmoid, rule_result: raw, deviation: B-G-05, rationale: "align with A's frozen recipe (sigmoid) so Brier, threshold and alert counts are on the same probability scale at the joint test; B: Brier raw 0.11414 vs sigmoid 0.11461, AP raw 0.2616 vs sigmoid 0.2482 (one fold SE 0.0349); source pipeline_b/stages/b08/classification/outputs/calibration_folds.csv", decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-24}
    threshold: {value: 0.16666666666666666, daily_alert_cap: 25, rationale: "1/6, the theoretical cost cutoff, on B's sigmoid probabilities, as A; 17.0 alerts/day out-of-fold (threshold_table_sigmoid.csv), within the 25/day cap; Henry: may be revisited after s10, which would be reported as a post-test change (G-79)", decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-24}

b09:
  classification:
    operating_threshold: {value: 0.26666666666666666, label: "4/15", frozen_threshold_kept: 0.16666666666666666, post_test_change: true, decision: B-G-07, rationale: "fewer false alarms per true detractor than the frozen 1/6 (Henry, B9 review point 7); reported on validation and on T1's saved test predictions, no refit; the frozen 1/6 result stays the unbiased test result (G-79)", decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-25}
  serving:
    fallback: {rule: "B inside its scope (seven states, distance present); A's frozen model outside", decision: B-G-06, decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-25}

b10:
  classification:
    operating_threshold: {value: 0.26666666666666666, label: "4/15", decision: B-G-07, frozen_threshold_kept: 0.16666666666666666, post_test_change: true, note: "B-G-09 (5/14) withdrawn 2026-10-26 as a typo; 4/15 stands", decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-26}
    out_of_scope_threshold: {value: 0.16666666666666666, label: "A frozen 1/6", decision: B10-D2, rationale: "B-G-07 applies to B only; expected out-of-scope alerts/day in serving_config.json", decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-26}
    alert_volumes: {accepted: true, rationale: "accepted for 5/14 and A at 1/6 on 2026-10-26; to re-confirm for 4/15 (B10 round 2, threshold_results.csv)", source: "pipeline_b/stages/b10/classification/outputs/threshold_results.csv", decision: B10-D2, decided_by: "Henry for the team", date: 2026-10-26}
    before_handover: {rule: "in-scope orders not yet handed over by the seller get no score; the missed-dispatch rule (B-C10) flags them once the shipping limit passes; A is not used for them", decision: B10-D9, decided_by: "Henry", date: 2026-10-26}
  validation_figures: {refit: false, rule: "restate B9's stored files (1/6 and 4/15 exact); test from T1's saved predictions", reason: "refits are not bit-reproducible across machines (WORKLOG 2026-10-26)", decision: B10-D10, decided_by: "Henry", date: 2026-10-26}
  parity_reprediction: {allowed: true, labels_read: false, scoring: false, tolerance: 1.0e-9, decision: B-G-08, rationale: "reload parity of the release bundles against T1's saved test predictions, as B9's no-refit check; not a second test read", decided_by: "Henry; experiment lead (Wu Qianzong)", date: 2026-10-26}
  out_of_profile: {sd_limit: 4, level: warning, rationale: "warn when a numeric input is more than 4 SD from the training mean; 3 SD warns too often (up to 7.7% of orders for one feature)", decision: B10-D11, decided_by: "Henry", date: 2026-10-26}

# Experiment 5 protocol. Pre-registered layer written by stages/s01_problem/common/run.py (README section 5.2).
# Data-dependent sections are written only by their owning stage (e5lib.protocol.set_data_dependent).
version: '1.0'
seed: 42
prediction_time:
  column: order_purchase_timestamp
  source: s01 1.1
tasks:
  regression:
    target: lead_days
    unit: days
    definition: order_delivered_customer_date - order_purchase_timestamp, fractional days; delivered orders with
      a valid lead time > 0
    label_available_at: delivery
    stakeholder: 'logistics / fulfilment planning: expected lead time per order at checkout, to flag long-haul orders
      and set realistic delivery promises'
    source: s01 1.1-1.3; s02 2.6
  classification:
    target: is_detractor
    positive_class: 1
    definition: minimum valid review score <= 2 for an eligible order (not cancelled or unavailable, and reviewed)
    sensitivity_label: is_detractor_first (first review only)
    label_available_at: last review answer
    score_meaning: risk of a 1-2 star review if the customer reviews (scope limit)
    stakeholder: 'customer-experience team: daily list of at-risk orders for proactive contact (status update, check
      with the seller)'
    source: s01 1.1-1.3; s02 2.6; G-34
populations:
  data_start: '2017-01-01 00:00:00'
  data_start_rule: 'orders purchased before data_start leave both tasks and never count in seller history: the 2016
    months are too thin to be representative (G-72)'
  both:
  - orders purchased before data_start excluded (G-72)
  - zero-item orders excluded
  - orders with missing payment_installments_max removed
  - orders without a usable payment removed (no payment rows, or only not_defined)
  - orders with a negative value in a log1p candidate removed (zero kept)
  regression: delivered orders with a valid lead time
  classification: orders not cancelled or unavailable, with a valid review; targets never imputed
  outliers:
    lead_days_rule: lead_days > max(100, mean + 12 * SD), mean and SD from pre-cutoff orders
    lead_days_floor_days: 100
    lead_days_sd_multiplier: 12
    distance_km_max_limit: 4397.53
    applies_to: development and test (G-21, audit 2 A1 kept)
  exclusions:
    file: 's02 exclusions.csv: order_id, task, step, reason_code, reason_description; one row per removed order
      and reason, every removal rule included'
    reason_codes:
      BEFORE_DATA_START: purchased before the data start 2017-01-01 00:00:00; the 2016 months are too thin to be
        representative (s02 2.8; G-72)
      INVALID_LEAD_TIME: not delivered, or delivery time missing or not after purchase (s02 2.6, 2.8)
      ZERO_ITEMS: order has no items (s02 2.8)
      CANCELLED_OR_UNAVAILABLE: order cancelled or unavailable (s02 2.8)
      NO_VALID_REVIEW: no valid review score (s02 2.8)
      INVALID_REVIEW_TIME: a valid review answered at or before the purchase time, a data error (s02 2.8; G-71)
      LEAD_DAYS_OUTLIER: lead_days above max(100, mean + 12 SD) of pre-cutoff orders (s02 2.9)
      DISTANCE_OUTLIER: distance_km_max above 4,397.53 km (s02 2.9)
      MISSING_INSTALLMENTS: payment_installments_max missing (s02 2.10)
      NO_USABLE_PAYMENT: no payment rows, or only the not_defined payment type (s02 2.11)
      NEGATIVE_VALUE: negative value in a log1p candidate (s02 2.13)
    rule: one description per reason code; s02 uses only these codes
    source: s02 2.6-2.11, 2.13; G-63
  source: s02 2.8-2.11, 2.13; G-20, G-21, G-51, G-62
features:
  contract: e5lib/contract.py (G-61)
  predictors:
  - n_items
  - n_products
  - n_sellers
  - n_categories
  - total_price
  - total_freight
  - freight_ratio
  - total_weight_g
  - total_volume_cm3
  - weight_missing_fraction
  - volume_missing_fraction
  - primary_category
  - category_missing_fraction
  - customer_state
  - primary_seller_state
  - distance_km_max
  - distance_missing_fraction
  - interstate_share
  - purchase_month
  - purchase_dayofweek
  - purchase_hour
  - primary_payment_type
  - payment_installments_max
  - n_payment_methods
  not_in_contract:
    has_items: 'post-purchase leakage: encodes a later cancellation (G-30)'
    freight_ratio_missing: 'post-purchase leakage: encodes a later cancellation (G-30)'
    payment_missing: 'constant after the population rules: s02 2.11 removes orders without a usable payment (G-42,
      G-51)'
  categorical:
  - customer_state
  - primary_seller_state
  - primary_category
  - primary_payment_type
  calendar_numeric:
  - purchase_month
  - purchase_dayofweek
  - purchase_hour
  counts:
  - n_items
  - n_products
  - n_sellers
  - n_categories
  - n_payment_methods
  - payment_installments_max
  shares:
  - weight_missing_fraction
  - volume_missing_fraction
  - category_missing_fraction
  - distance_missing_fraction
  - interstate_share
  never_predictors:
  - order_status
  - order_approved_at
  - order_delivered_carrier_date
  - order_delivered_customer_date
  - shipping_limit_date
  - review fields
  - order_estimated_delivery_date
  log1p:
    skewness_threshold: 1.0
    skewness_on: pre-cutoff development orders
    candidates:
    - total_price
    - total_freight
    - total_weight_g
    - total_volume_cm3
    - distance_km_max
    never:
      freight_ratio: team decision in the s01 review (G-62)
      counts: integer counts (G-62)
      calendar fields: numeric calendar positions (G-22, G-47)
      shares and fractions: bounded 0-1 values (G-47)
    missing_values: stay missing through log1p; imputed afterwards in the fold pipeline
    negative_values: orders removed in s02 2.13 (reason NEGATIVE_VALUE)
    regression_target: true
    source: s04 4.2; G-36, G-47, G-62
  collinearity:
    abs_correlation_above: 0.9
    vif_above: 10
    decided_by: team (human_decisions.yaml)
    source: s04 4.3; G-26
  selection:
    ranking:
      regression: absolute Spearman
      classification: mutual information
    cumulative_threshold_options:
    - 0.95
    - 0.99
    decided_by: team after s03 (G-31)
    source: s03 3.8, s04 4.4; G-19, G-42
  screening_candidates:
    columns:
      classification:
        product_photos_qty:
          group: product
          kind: numeric
          source: products.product_photos_qty of the primary item
          transform: scaled, never logged (count)
        product_description_lenght:
          group: product
          kind: numeric
          source: products.product_description_lenght of the primary item
          transform: log1p if pre-cutoff skewness > 1, then scaled
        product_name_lenght:
          group: product
          kind: numeric
          source: products.product_name_lenght of the primary item
          transform: log1p if pre-cutoff skewness > 1, then scaled
        est_delivery_days:
          group: promise
          kind: numeric
          source: orders.order_estimated_delivery_date - order_purchase_timestamp (days)
          transform: log1p if pre-cutoff skewness > 1, then scaled; in production fed by the task 1 prediction,
            so if adopted the classifier trains on out-of-fold task 1 predictions (G-69)
        customer_region:
          group: region
          kind: categorical
          source: IBGE macro-region of customer_state
          transform: one-hot (drop-first for linear/logistic), unknown level handled
        seller_region:
          group: region
          kind: categorical
          source: IBGE macro-region of primary_seller_state
          transform: one-hot (drop-first for linear/logistic), unknown level handled
        region_pair:
          group: region
          kind: categorical
          source: customer_region > seller_region (route between macro-regions)
          transform: one-hot (drop-first for linear/logistic), unknown level handled
        seller_prior_review_mean:
          group: seller_history
          kind: numeric
          source: mean valid review score of the primary seller's earlier orders, reviews answered strictly before
            this purchase (own order excluded)
          transform: scaled; missing for sellers without an earlier review (imputed in folds with a missing indicator)
        seller_prior_review_count:
          group: seller_history
          kind: numeric
          source: number of those reviews
          transform: log1p if pre-cutoff skewness > 1, then scaled
        seller_prior_detractor_share:
          group: seller_history
          kind: numeric
          source: share of those reviews with score <= 2
          transform: scaled, never logged (share); missing as for the mean
        seller_prior_delivered_count:
          group: seller_history
          kind: numeric
          source: number of the primary seller's earlier orders delivered strictly before this purchase
          transform: log1p if pre-cutoff skewness > 1, then scaled
        seller_prior_late_share:
          group: seller_history
          kind: numeric
          source: share of those deliveries after their estimated delivery date
          transform: scaled, never logged (share); missing when no earlier delivery
    order_level_rule: value of the primary item (highest price, then lowest order_item_id), as for primary_category
    role: screened in s03 for the named task only; enter that task's selection pool only if adopted at the s03 gate
      (human_decisions.yaml)
    assumption: catalogue fields fixed at checkout (stated limitation)
    added_after_eda: s03 round 1 and 2 reviews; disclosed as a post-hoc addition
    promise_note: est_delivery_days is screened for classification only (G-35 reopened for this screen); if adopted,
      training uses out-of-fold task 1 predictions, as production would
    seller_history_rule: events of the primary seller strictly before purchase_ts (to the second), own order excluded
      by order_id; reviews at their answer time, deliveries at delivery time
    source: G-68, G-69
  route_median:
    column: distance_km_max
    keys:
    - - customer_state
      - primary_seller_state
    - - customer_state
    source: s04 4.8; G-27
split:
  test_share: 0.2
  rule: newest 20% of each task's eligible orders by purchase time; cutoff computed in s02
  test_side_customer_purge: true
  size_checks:
    regression:
      min_share_of_eligible_delivered: 0.15
    classification:
      min_share_of_eligible_reviewed: 0.15
      min_share_of_detractors: 0.15
  random_fallback: false
  name: new-customer time-ordered holdout
  source: s05 5.2-5.4; G-18, G-28, G-46, G-48
cv:
  n_folds: 5
  scheme: expanding, time-ordered, equal-sized validation blocks by order count
  fold_customer_purge: training side
  label_maturity: true
  minimums:
    training_rows_per_fold: 10000
    positives_per_part: 100
    rule: 'every fold''s training part keeps at least training_rows_per_fold rows (both tasks); classification:
      training and validation parts each keep at least positives_per_part detractors; set before any fold is built
      (G-53, G-74)'
  data_dependent_in_s05:
  - fold_boundaries
  - class_support
  - min_training_rows
  source: s05 5.5-5.8; G-23, G-53
metrics:
  regression:
    primary: mae
    secondary:
    - rmse
    - r2
    - within_3d
  classification:
    primary: ap
    secondary:
    - roc_auc
    - brier
    - precision
    - recall
    - f1
    - confusion_matrix
    never_alone: accuracy
  charts: precision-recall and ROC curves out-of-fold (s06 6.6) and on test (s09), with curve data
  citations:
  - willmott2005
  - saito2015
  - brier1950
  source: s01 1.4; G-24
cost:
  fn: 5
  fp: 1
  nature: illustrative assumption, never measured ROI
  citations:
  - elkan2001
  source: s01 1.5
families:
  regression:
  - dummy_median
  - linear
  - ridge
  - tree_reg
  - forest_reg
  classification:
  - dummy_prior
  - logistic
  - tree_clf
  - forest_clf
  excluded: boosting, voting, stacking
  s06_settings:
    logistic: unregularised (C = inf), lbfgs, max_iter 5000
    tree:
      max_depth: 5
      min_samples_leaf: 100
    forest:
      n_estimators: 200
      max_depth: 10
      min_samples_leaf: 50
      max_features: sqrt
  source: s01 1.6; s06 6.2
decision_rule:
  name: one-standard-error rule
  statement: keep the simplest candidate whose fold-mean primary metric is within one standard error of the best
    mean; SE = fold SD / sqrt(5); ties go to the simpler
  simplicity_order:
  - dummy
  - linear/logistic
  - single tree
  - forest
  within_family_simpler: higher alpha, lower C, shallower depth, then larger leaf
  plain_vs_tuned: the plain s06 model is kept if it is within one SE of the tuned configuration (G-55)
  fallback: if no complex variant passes, the best simple model goes forward; if nothing beats the dummy, the dummy
    is the result
  s08_gate: the rule recommends; the team confirms; an override is a logged protocol deviation (G-39, G-44)
  paired_differences: reported as description only
  citations:
  - breiman1984
  - hastie2009
  - friedman2010
  source: s01 1.7; G-33, G-44, G-55
grids:
  ridge_alpha: &id001
  - 0.01
  - 0.1
  - 0.5
  - 1
  - 5
  - 10
  - 20
  - 50
  - 100
  logistic_C: *id001
  logistic_penalty: l2
  tree:
    max_depth:
    - 4
    - 5
    - 6
    - 8
    - 10
    - 12
    - 14
    - 16
    - 18
    min_samples_leaf:
    - 20
    - 50
    - 100
    - 200
  forest:
    max_depth:
    - 8
    - 10
    - 12
    - 14
    - 16
    - 18
    min_samples_leaf:
    - 20
    - 50
    - 100
    - 200
    n_estimators: 200
    max_features: sqrt
  class_weight:
  - null
  - balanced
  rule: fixed before any tuning result; no grid points added after results are seen
  citations:
  - breiman2001
  source: s01 1.8; s07 7.1-7.4; G-37, G-43
calibration:
  method: sigmoid
  always_scored: true
  keep_if: mean Brier improves and mean AP stays within one fold SE of the raw model
  source: s08 8.3; G-16, G-45, G-52
threshold:
  candidates:
  - no alerts
  - 0.5
  - 1/6 (cost cutoff)
  - empirical minimum of 5*FN + FP
  ties: higher threshold (fewer alerts)
  chosen_by: team at the s08 hard stop
  default_recommendation: minimise the illustrative cost subject to the daily alert cap
  source: s08 8.4; G-39, G-56
evaluation:
  bootstrap_resamples: 1000
  confidence: 0.95
  resample_unit: test order (G-50, C3 rejected)
  classification_slice_min_detractors: 100
  regression_slice_min_orders: 100
  eda_consistency_alert:
    spearman_below: 0.5
    top10_overlap_below: 5
  source: s09 9.1-9.5; G-40, G-54
